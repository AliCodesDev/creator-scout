[project]
name = "scout"
version = "0.1.0"
description = "Creator Scout API: campaign brief in, ranked creator shortlist out."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.27.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
